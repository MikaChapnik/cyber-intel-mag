# Publishes cyberbriefdaily.com.
# The gh-pages branch holds the raw output of rebuild.py; this workflow applies
# the v2 design (.cbd/restyle.py) and deploys the result. Nothing to do by hand.
name: Deploy site

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply v2 design
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '.cbd' ./ _site/
          python .cbd/restyle.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
